
name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '*.sh'
      - '*.txt'
      - '*.png'
      - '.github/workflows/build-linux-appimage.yml'

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-venv build-essential libfuse2 wget

      - name: Install AppImageTool
        run: |
          wget -O appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          sudo mv appimagetool.AppImage /usr/local/bin/appimagetool

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x build_linux_appimage.sh
          ./build_linux_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageConverter-Linux-x86_64
          path: ImageConverter-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
